    teaching_and_program_building:
      - label: 2023-2025 instruction
        details: Primary instructor or co-instructor for 22 workshops/sessions, personally reaching 1,118 learners across UCLA, UC Carpentries, UC Love Data Week, and standalone programming
      - label: Guest lectures
        details: "UCLA DH 201 (Intro to Digital Humanities); UCLA Labor Studies Capstone (OpenRefine + Tableau); UCLA NS 191H/NS192BX Neuroscience Honors Seminar; UCLA IS262A \"Data Management Plans and the Role of Libraries\" (Oct 2025, published/DOI'd)"
      - label: Teaching outside UCLA
        details: Carpentries Instructor Training co-instructor (100+ learners total); Library Carpentry workshops for other institutions (200+ learners), 2022-2025
      - label: Library Carpentry Curriculum Advisory/Governance Group
        details: Co-Chair (2021-present) — defined the formal lesson adoption process; led adoption of four new lessons (Intro to Python, Computational Thinking, Data Management Planning, AI for GLAM); Lesson Development Trainer (2024-present); Instructor Trainer (2017-present); Instructor (2015-present)
      - label: '"Intro to AI for GLAM" Code Sprint (Jan 2024)'
        details: Co-hosted a seven-hour global code sprint with the Library Carpentry Curriculum Advisory Committee to advance this AI-literacy lesson toward stable release; 14 participants from 9 institutions across the US, UK, Germany, and South Africa (including Hugging Face, the Smithsonian, and The National Archives UK); 14 issues closed, 7 pull requests merged, accessible SVG flowcharts and alt-text added throughout the lesson
      - label: '"Agentic Research Workflows" Lesson (2026, in development)'
        details: "Author, Carpentries Workbench lesson on using AI coding agents for research work while preserving validation, reproducibility, and research judgment — covers CLI-first workflows, project-grounding via CLAUDE.md/AGENTS.md, and validation strategies (synthetic data generation, domain plausibility, cross-AI auditing); adapted from the UC Berkeley D-Lab \"Vibe Coding for Research\" workshop"

