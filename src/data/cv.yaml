    experience:
      - company: UCLA Library
        position: Director, Data Science Center
        start_date: 2017-04
        end_date: present
        location: Los Angeles, CA
        highlights:
          - Lead campus data services and computational research support; supervise 4 FTE staff (1 vacancy) and 5 DataSquad student staff directly, 15 student consultants across program history; ~10-12 total team including cross-functional project teams (ML/AI, Dataverse/Data Management, Emerging Technologies, GIS, OSPO)
          - Manage annual operating budget of approximately $600K across multiple accounts
          - "**UCLA Dataverse** (2018-present): 312 registered users, 1,603 datasets, 142,300+ downloads, grown from 15 files (2019) to 54,655 files (2026); harvested 1,014 legacy Social Science Data Archive datasets"
          - "**Redivis** (2022-present): selected and licensed the platform, negotiated restricted-dataset access, navigated FERPA/PHI/HIPAA compliance approval for P3/P4 restricted research data; scaled from 5 workflows/444GB (Jan 2023) to 2.9PB processed (2024); supports UCLA Political Science research publishing in *APSR*, *PNAS*, *BJPolS*, *AEJ: Policy*; cited at FORCE11 2024"
          - "**DataSquad** (2021-present): founded and direct this student consulting workforce, 24% of total service volume, 100% career placement (10/10 students) at McKinsey, Amazon, World Wide Technology, Ekimetrics, CVS Health, AIG, Stanford"
          - "Research support enabled a $5M Dana Center for Neuroscience and Society grant (Carceral Ecologies partnership) and federal NIH/NSF/Robert Wood Johnson Foundation grants (BioCritical Studies Lab); together these directly supported 2 of 6 (33%) of UCLA's 2024 Public Impact Research Award winners"
          - Co-led ESRI licensing transformation (Jan 2023), doubling monthly new user registrations on average; lead coordinator for campus response to the NIH Data Management and Sharing Policy
          - "Sponsored and participated in DSC/DataSquad AI/ML pilot projects (2023-present): participant in a Library Systems Team/DSC experiment evaluating OCR, spaCy NER, and OpenAI models for automated metadata extraction on the 10,000+ document Campaign Literature Archive against Dublin Core/MODS standards (2023); sponsored a DataSquad prototype exploring LLM-assisted Data Management Plan generation (Nov 2023); provided hands-on technical support on a DataSquad oral history AI-transcription project, including Redivis AI-layer integration and Hugging Face model setup"
          - Nominee, UCLA Administrative Management Group Excellence in Leadership Award, 2025 — nominated by direct reports
      - company: UC San Diego Library
        position: Data Services & Collections Librarian
        start_date: 2015-01
        end_date: 2017-04
        location: La Jolla, CA
        highlights:
          - Provided consultation and training on data discovery/reuse, research data management, and statistical programming; administered UCSD's local Dataverse instance
          - Proposed and led redesign of the Data/GIS Lab into a studio-style cross-disciplinary data services space (opened Fall 2016)
          - Organized UCSD's inaugural Software Carpentry Workshop (Fall 2015); advocated successfully for the Library to become a Software Carpentry Affiliate; became a badged Software/Data Carpentry instructor
          - Built a recurring data skills series with UCSD's School of Global Policy and Strategy — curriculum design and reproducible-workflow (TIER methodology) training for graduate students
      - company: UC Berkeley Library
        position: Research Technology & Services Specialist, Library Data Lab
        start_date: 2006-01
        end_date: 2015-01
        location: Berkeley, CA
        highlights:
          - Co-designed, opened (2008), and managed the Library Data Lab; provided quantitative reasoning consultation, 15 hours/week, to a lab serving 1,000+ users/year
          - Established the Library's LibTech internal training program (Google Analytics, web widgets, Python, Drupal)
          - Drupal developer for the library — architected multiple production sites; implemented Agile methods, Vagrant, GitHub, Travis CI, and Behavior-Driven Development with the dev team

